<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveBPM - WebAssembly</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background: #1a1a1a; color: #eee;
        }
        .container { text-align: center; }
        h1 { font-size: 1.8rem; margin-bottom: 2em; opacity: 0.7; }
        .bpm-display {
            font-size: 5rem; font-weight: 700; color: #00d4aa;
            font-variant-numeric: tabular-nums; min-height: 120px;
            display: flex; align-items: center; justify-content: center;
        }
        .confidence { font-size: 1.2rem; margin-top: 1rem; opacity: 0.8; }
        .confidence-bar {
            width: 300px; height: 8px; background: #333; border-radius: 4px;
            margin: 0.5em auto; overflow: hidden;
        }
        .confidence-fill {
            height: 100%; background: #00d4aa; border-radius: 4px;
            transition: width 0.3s ease;
        }
        button {
            margin-top: 2rem; padding: 0.8rem 2rem; font-size: 1.1rem;
            background: #00d4aa; color: #1a1a1a; border: 1px solid #00b490;
            border-radius: 8px; cursor: pointer; font-weight: 600;
        }
        button:hover { background: #00f0c0; border-color: #00b490; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .status { margin-top: 1rem; font-size: 0.9rem; opacity: 0.5; }
        .note-resolution {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px 20px;
            max-width: 90vw;
            gap: 20px;
        }
        .note-resolution label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.95rem;
            opacity: 0.9;
            white-space: nowrap;
        }
        .note-resolution input[type="radio"] {
            margin-right: 8px;
            cursor: pointer;
            accent-color: #00d4aa; 
        }
        .advanced-toggle { margin-top: 1.5rem; font-size: 0.9rem; opacity: 0.7; cursor: pointer; }
        .advanced-menu {
            display: none; background: #242424; border-radius: 8px; padding: 20px;
            margin-top: 15px; text-align: left; 
            width: 700px; max-width: 95vw;
            margin-left: auto; margin-right: auto;
            border: 1px solid #333;
        }
        .advanced-menu.active { display: block; }
        .param-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            column-gap: 30px;
            row-gap: 15px;
        }
        .param-group { 
            margin-bottom: 0; 
        }
        .param-group label { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.85rem; 
            margin-bottom: 5px; 
            color: #aaa; 
        }
        .param-group label.checkbox-label { 
            align-items: center; 
            cursor: pointer; 
        }
        .param-group input[type="range"] { 
            width: 100%; 
            accent-color: #00d4aa;
            cursor: pointer;
        }
        .param-group input[type="checkbox"] { 
            width: 16px; 
            height: 16px; 
            accent-color: #00d4aa; 
            cursor: pointer; 
        }
        .param-section {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }
        .param-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .param-section h3 {
            font-size: 1rem;
            color: #eee;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        .menu-controls {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }
        .preset-select { 
            flex: 0 1 300px;
            width: 100%;
            padding: 6px;
            background: #1a1a1a;
            color: #eee;
            border: 1px solid #444;
            border-radius: 4px;
            margin-bottom: 0;
        }
        .action-buttons {
            flex: 0 1 auto;
            display: flex;
            gap: 15px;
            justify-content: center;
            gap: 15px;
        }
        .advanced-btn {
            margin-top: 0;
            padding: 5px 15px;
            font-size: 0.9rem;
            background: #333;
            color: #eee;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .reset-btn {
            border-color: #ff8787;
        }
        .advanced-btn:hover {
            background: #00f0c0;
            color: #1a1a1a;
            border-color: #00b490;
        }
        .reset-btn:hover {
            background: #ff5656;
            color: #1a1a1a;
            border-color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LiveBPM</h1>
        <div class="bpm-display" id="bpmDisplay">--</div>
        
        <div class="confidence">
            Confidence
            <div class="confidence-bar">
                <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="note-resolution">
            <label>
                <input type="radio" name="resolution" value="6" onchange="updateNoteResolution(this.value)"> 
                Smart
            </label>
            <label>
                <input type="radio" name="resolution" value="1" onchange="updateNoteResolution(this.value)"> 
                1/2 Note
            </label>
            <label>
                <input type="radio" name="resolution" value="2" onchange="updateNoteResolution(this.value)" checked> 
                1/4 Note
            </label>
            <label>
                <input type="radio" name="resolution" value="3" onchange="updateNoteResolution(this.value)"> 
                1/8 Note
            </label>
            <label>
                <input type="radio" name="resolution" value="4" onchange="updateNoteResolution(this.value)"> 
                1/8 Note Triplet
            </label>
            <label>
                <input type="radio" name="resolution" value="5" onchange="updateNoteResolution(this.value)"> 
                1/16 Note
            </label>
        </div>

        <div class="advanced-toggle" onclick="document.getElementById('advMenu').classList.toggle('active')">
            Advanced Menu &blacktriangledown;
        </div>
        
        <div class="advanced-menu" id="advMenu">
            <div class="menu-controls">
                <select class="preset-select" id="presetSelect" onchange="loadPreset(this.value)" disabled>
                    <option value="default">Default / General Purpose</option>
                    <option value="cajon">Cajón Flamenco (Percussive)</option>
                    <option value="flute">Flute (Legato)</option>
                    <option value="guitar">Guitar, Acoustic</option>
                    <option value="electricguitar">Guitar, Electric</option>
                    <option value="acousticbass">Bass, Acoustic</option>
                    <option value="electricbass">Bass, Electric</option>
                    <option value="saxophone">Saxophone (Alto / Tenor)</option>
                    <option value="liveband">Full Band / Live Mix</option>
                    <option value="slowacoustic">Ambient / Slow Acoustic</option>
                </select>

                <div class="action-buttons">
                    <button class="advanced-btn" onclick="resetEngine()" title="Flush DSP State">Flush</button>
                    <button class="advanced-btn reset-btn" onclick="resetSettings()" title="Revert to default settings">Reset</button>
                </div>
            </div>

            <div class="param-section">
                <h3>Onset Detection & Gating</h3>
                <div class="param-grid">
                    <div class="param-group">
                        <label>Noise Gate (Silence) <span id="silenceThresholdVal">0.030</span></label>
                        <input type="range" id="silenceThreshold" min="0.0" max="0.1" step="0.005" value="0.03" oninput="updateParam('silenceThreshold', this.value)">
                    </div>
                    <div class="param-group">
                        <label>Complex Domain Weight <span id="complexDomainWeightVal">0.400</span></label>
                        <input type="range" id="complexDomainWeight" min="0.0" max="1.0" step="0.05" value="0.4" oninput="updateParam('complexDomainWeight', this.value)">
                    </div>
                    <div class="param-group">
                        <label>Onset Sensitivity <span id="onsetSensitivityVal">0.015</span></label>
                        <input type="range" id="onsetSensitivity" min="0.001" max="0.1" step="0.001" value="0.015" oninput="updateParam('onsetSensitivity', this.value)">
                    </div>
                    <div class="param-group">
                        <label>Gating Alpha (Adaptation) <span id="gatingAlphaVal">0.100</span></label>
                        <input type="range" id="gatingAlpha" min="0.01" max="0.5" step="0.01" value="0.1" oninput="updateParam('gatingAlpha', this.value)">
                    </div>
                    <div class="param-group">
                        <label>Flux Compression (Log1p) <span id="fluxCompressionVal">50.0</span></label>
                        <input type="range" id="fluxCompression" min="10.0" max="100.0" step="1.0" value="50.0" oninput="updateParam('fluxCompression', this.value)">
                    </div>
                    <div class="param-group">
                        <label>Novelty Smoothing <span id="noveltySmoothingVal">0.400</span></label>
                        <input type="range" id="noveltySmoothing" min="0.05" max="0.9" step="0.05" value="0.4" oninput="updateParam('noveltySmoothing', this.value)">
                    </div>
                </div>
            </div>

            <div class="param-section">
                <h3>Tempo Engine & Hysteresis</h3>
                <div class="param-grid">
                    <div class="param-group">
                        <label>Target Minimum BPM <span id="minBpmVal">40.0</span></label>
                        <input type="range" id="minBpm" min="30.0" max="120.0" step="1.0" value="40.0" oninput="updateParam('minBpm', this.value)">
                    </div>
                    <div class="param-group">
                        <label>Target Maximum BPM <span id="maxBpmVal">240.0</span></label>
                        <input type="range" id="maxBpm" min="120.0" max="480.0" step="1.0" value="240.0" oninput="updateParam('maxBpm', this.value)">
                    </div>
                    <div class="param-group">
                        <label class="checkbox-label">
                            Heuristics (Octave/Pattern correction)
                            <input type="checkbox" id="heuristicsToggle" checked onchange="toggleHeuristics(this.checked)">
                        </label>
                    </div>
                    <div class="param-group">
                        <label>Hysteresis Blend (Stickiness) <span id="hysteresisBlendVal">0.050</span></label>
                        <input type="range" id="hysteresisBlend" min="0.01" max="0.2" step="0.01" value="0.05" oninput="updateParam('hysteresisBlend', this.value)">
                    </div>
                    <div class="param-group">
                        <label>Double-Time Jump Tolerance <span id="doubleTimeJumpThresholdVal">20.0</span></label>
                        <input type="range" id="doubleTimeJumpThreshold" min="5.0" max="40.0" step="5.0" value="20.0" oninput="updateParam('doubleTimeJumpThreshold', this.value)">
                    </div>
                    <div class="param-group">
                        <label>Half-Time Jump Tolerance <span id="halfTimeJumpThresholdVal">10.0</span></label>
                        <input type="range" id="halfTimeJumpThreshold" min="5.0" max="30.0" step="5.0" value="10.0" oninput="updateParam('halfTimeJumpThreshold', this.value)">
                    </div>
                </div>
            </div>

            <div class="param-section">
                <h3>Display Output</h3>
                <div class="param-grid">
                    <div class="param-group">
                        <label>UI Smoothing (Alpha) <span id="uiSmoothingVal">0.150</span></label>
                        <input type="range" id="uiSmoothing" min="0.01" max="0.5" step="0.01" value="0.15" oninput="updateParam('uiSmoothing', this.value)">
                    </div>
                    <div class="param-group">
                        <label>Visual Deadzone (Drift filter) <span id="visualDeadzoneVal">0.20</span></label>
                        <input type="range" id="visualDeadzone" min="0.0" max="5.0" step="0.1" value="0.2" oninput="updateParam('visualDeadzone', this.value)">
                    </div>
                    <div class="param-group">
                        <label>Magnetic Snap Range <span id="magneticSnapRangeVal">0.15</span></label>
                        <input type="range" id="magneticSnapRange" min="0.0" max="0.5" step="0.05" value="0.15" oninput="updateParam('magneticSnapRange', this.value)">
                    </div>
                </div>
            </div>
        </div>

        <button id="startBtn" onclick="startAudio()" disabled>Start</button>
        <div class="status" id="status">Loading WASM...</div>
    </div>

<script type="module">        
        let audioContext = null;
        let clearDisplayTimeout = null;
        let audioWorkletNode = null;

        
        let currentDisplayBpm = 0.0;
        let ALPHA = 0.15; // EMA smoothing factor (lower = smoother)
        const CONF_THRESHOLD = 0.45; // Ignore incoming BPMs if confidence is below this
        let VISUAL_DEADZONE = 0.2; // BPM changes smaller than this won't update the display to prevent jitter. Default value, will be overridden by worklet message
        let MAGNETIC_SNAP_RANGE = 0.15;

        window.startAudio = async function() {
            const btn = document.getElementById('startBtn');
            const status = document.getElementById('status');
            
            try {
                btn.disabled = true;
                status.textContent = 'Requesting microphone access...';

                // Create AudioContext
                audioContext = new AudioContext({ sampleRate: 48000 });
                
                // Request microphone stream
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    }
                });

                // Fetch WASM binary on main thread
                status.textContent = 'Downloading WASM binary...';
                const wasmResponse = await fetch('livebpm_wasm.wasm');
                const wasmBinary = await wasmResponse.arrayBuffer();

                status.textContent = 'Loading WASM Module...';

                // Load AudioWorklet
                await audioContext.audioWorklet.addModule('processor.js');

                // Create worklet node
                audioWorkletNode = new AudioWorkletNode(audioContext, 'livebpm-processor');
                
                // Listen for results from worklet
                audioWorkletNode.port.onmessage = (event) => {
                    const { type, data, message } = event.data;
                    if (type === 'ready') {
                        status.textContent = 'Listening... play a rhythm!';
                        btn.textContent = 'Listening...';

                        document.getElementById('presetSelect').disabled = false;
                        syncParametersToEngine();
                    } else if (type === 'result') {
                        updateDisplay(data);
                    } else if (type === 'error') {
                        status.textContent = 'Error: ' + message;
                    } else if (type === 'presetLoaded') {
                        const config = data;
                        
                        // Update JS local state
                        ALPHA = config.uiSmoothing;
                        VISUAL_DEADZONE = config.visualDeadzone;
                        MAGNETIC_SNAP_RANGE = config.magneticSnapRange;
                        
                        // Update Checkbox
                        document.getElementById('heuristicsToggle').checked = config.heuristics;
                        
                        // Helper to update sliders and labels without re-triggering WASM updates
                        const setSlider = (id, val, isInt) => {
                            const el = document.getElementById(id);
                            const textEl = document.getElementById(id + 'Val');
                            if (el && textEl) {
                                el.value = val;
                                textEl.textContent = isInt ? val.toFixed(1) : val.toFixed(3);
                            }
                        };

                        setSlider('silenceThreshold', config.silenceThreshold, false);
                        setSlider('onsetSensitivity', config.onsetSensitivity, false);
                        setSlider('complexDomainWeight', config.complexDomainWeight, false);
                        setSlider('gatingAlpha', config.gatingAlpha, false);
                        setSlider('noveltySmoothing', config.noveltySmoothing, false);
                        setSlider('fluxCompression', config.fluxCompression, true);
                        setSlider('hysteresisBlend', config.hysteresisBlend, false);
                        setSlider('uiSmoothing', config.uiSmoothing, false);
                        
                        const vdEl = document.getElementById('visualDeadzone');
                        if (vdEl) vdEl.value = config.visualDeadzone;
                        document.getElementById('visualDeadzoneVal').textContent = config.visualDeadzone.toFixed(2);

                        const magEl = document.getElementById('magneticSnapRange');
                        if (magEl) magEl.value = config.magneticSnapRange;
                        document.getElementById('magneticSnapRangeVal').textContent = config.magneticSnapRange.toFixed(2);

                        setSlider('minBpm', config.minBpm, true);
                        setSlider('maxBpm', config.maxBpm, true);
                        setSlider('doubleTimeJumpThreshold', config.doubleTimeJumpThreshold, true);
                        setSlider('halfTimeJumpThreshold', config.halfTimeJumpThreshold, true);

                        flushUIState();
                    }
                };

                // Connect graph: Mic -> WorkletNode
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(audioWorkletNode);

                // Initialise WASM engine in worklet
                audioWorkletNode.port.postMessage({ 
                    type: 'init',
                    sampleRate: audioContext.sampleRate,
                    wasmBinary: wasmBinary
                });

            } catch (err) {
                status.textContent = 'Error: ' + err.message;
                btn.disabled = false;
                btn.textContent = 'Retry';
            }
        };

        window.updateNoteResolution = function(value) {
            if (audioWorkletNode) {
                audioWorkletNode.port.postMessage({
                    type: 'setResolution',
                    value: parseInt(value)
                });
                // Flush the UI state
                flushUIState();
            }
        };

        window.toggleHeuristics = function(setting) {
            if (audioWorkletNode) {
                audioWorkletNode.port.postMessage({
                    type: 'setHeuristics',
                    enabled: setting
                });
                // Flush the UI state
                flushUIState();
            }
        };

        window.updateParam = function(param, value) {
            value = parseFloat(value);

            // Format whole numbers for BPM limits and thresholds
            if (['minBpm', 'maxBpm', 'doubleTimeJumpThreshold', 'halfTimeJumpThreshold', 'fluxCompression'].includes(param)) {
                document.getElementById(param + 'Val').textContent = value.toFixed(1);
            } else if (param === 'visualDeadzone') {
                document.getElementById(param + 'Val').textContent = value.toFixed(2);
            } else {
                document.getElementById(param + 'Val').textContent = value.toFixed(3);
            }
            
            if (param === 'uiSmoothing') {
                ALPHA = value; // Update JS-side parameter directly
                return;
            }
            
            if (param === 'visualDeadzone') {
                VISUAL_DEADZONE = value; // Update JS-side parameter directly
                return;
            }

            if (param === 'magneticSnapRange') {
                MAGNETIC_SNAP_RANGE = value; // Update JS-side parameter directly
                return;
            }
            
            // Dispatch C++ parameter changes to the worklet
            if (audioWorkletNode) {
                audioWorkletNode.port.postMessage({
                    type: 'setParameter',
                    param: param,
                    value: value
                });
            }
        };

        function syncParametersToEngine() {
            // Sync radio buttons (Resolution)
            const res = document.querySelector('input[name="resolution"]:checked').value;
            window.updateNoteResolution(res);

            // Sync toggle (Heuristics)
            const heuristics = document.getElementById('heuristicsToggle').checked;
            window.toggleHeuristics(heuristics);

            // Sync all range sliders
            const params = [
                'silenceThreshold', 'onsetSensitivity', 'complexDomainWeight', 
                'gatingAlpha', 'noveltySmoothing', 'fluxCompression', 'hysteresisBlend',
                'uiSmoothing', 'minBpm', 'maxBpm', 
                'doubleTimeJumpThreshold', 'halfTimeJumpThreshold', 'visualDeadzone',
                'magneticSnapRange'
            ];
            
            params.forEach(param => {
                const el = document.getElementById(param);
                if (el) {
                    window.updateParam(param, el.value);
                }
            });
        }

        window.loadPreset = function(preset) {
            if (audioWorkletNode) {
                audioWorkletNode.port.postMessage({ type: 'loadPreset', preset: preset });
            }
        };

        window.resetEngine = function() {
            if (audioWorkletNode) {
                audioWorkletNode.port.postMessage({ type: 'reset' });
                flushUIState();
            }
        };

        window.resetSettings = function() {
            const currentPreset = document.getElementById('presetSelect').value;
            window.loadPreset(currentPreset);
        };

        function flushUIState() {
            currentDisplayBpm = 0.0;
            document.getElementById('bpmDisplay').textContent = '--';
            document.getElementById('confidenceFill').style.width = '0%';
        }

        function updateDisplay(data) {
            const bpmEl = document.getElementById('bpmDisplay');
            const confEl = document.getElementById('confidenceFill');
            
            if (data.hasValidEstimate) {
                if (clearDisplayTimeout) {
                    clearTimeout(clearDisplayTimeout);
                    clearDisplayTimeout = null;
                }

                // Confidence Gating. Only process the new BPM if the engine is confident
                if (data.confidence >= CONF_THRESHOLD) {
                    
                    if (currentDisplayBpm === 0.0) {
                        currentDisplayBpm = data.bpm;
                    }

                    // Exponential Moving Average (EMA)
                    currentDisplayBpm = (ALPHA * data.bpm) + ((1.0 - ALPHA) * currentDisplayBpm);
                }

                // Floating-Point Deadzones
                let targetDisplayValue = currentDisplayBpm;

                
                // Magnetic Snapping
                let nearestWhole = Math.round(targetDisplayValue);
                if (Math.abs(targetDisplayValue - nearestWhole) < MAGNETIC_SNAP_RANGE) {
                    targetDisplayValue = nearestWhole;
                }
                

                let currentlyDisplayed = parseFloat(bpmEl.textContent);

                // Apply deadzone
                if (!isNaN(currentlyDisplayed)) {
                    if (Math.abs(targetDisplayValue - currentlyDisplayed) < VISUAL_DEADZONE) {
                        targetDisplayValue = currentlyDisplayed; 
                    }
                }

                // Update DOM
                bpmEl.textContent = targetDisplayValue.toFixed(1);
                confEl.style.width = (data.confidence * 100) + '%';

            } else {
                // INVALID READING
                // Start a 2-second countdown to clear the display if there are no valid estimates
                if (!clearDisplayTimeout) {
                    clearDisplayTimeout = setTimeout(() => {
                        currentDisplayBpm = 0.0; // Reset the EMA tracker
                        bpmEl.textContent = '--';
                        confEl.style.width = '0%';
                    }, 2000);
                }
            }
        }

        // Enable the button once the script is loaded
        document.getElementById('status').textContent = 'Ready. Press Start.';
        document.getElementById('startBtn').disabled = false;
    </script>
</body>
</html>
