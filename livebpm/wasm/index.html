<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveBPM - WebAssembly</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background: #1a1a1a; color: #eee;
        }
        .container { text-align: center; }
        h1 { font-size: 1.8rem; margin-bottom: 2em; opacity: 0.7; }
        .bpm-display {
            font-size: 5rem; font-weight: 700; color: #00d4aa;
            font-variant-numeric: tabular-nums; min-height: 120px;
            display: flex; align-items: center; justify-content: center;
        }
        .confidence { font-size: 1.2rem; margin-top: 1rem; opacity: 0.8; }
        .confidence-bar {
            width: 300px; height: 8px; background: #333; border-radius: 4px;
            margin: 0.5em auto; overflow: hidden;
        }
        .confidence-fill {
            height: 100%; background: #00d4aa; border-radius: 4px;
            transition: width 0.3s ease;
        }
        button {
            margin-top: 2rem; padding: 0.8rem 2rem; font-size: 1.1rem;
            background: #00d4aa; color: #1a1a1a; border: none;
            border-radius: 8px; cursor: pointer; font-weight: 600;
        }
        button:hover { background: #00f0c0; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .status { margin-top: 1rem; font-size: 0.9rem; opacity: 0.5; }
        .note-resolution {
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .note-resolution label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.95rem;
            opacity: 0.9;
            white-space: nowrap;
        }

        .note-resolution input[type="radio"], .note-resolution input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LiveBPM</h1>
        <div class="bpm-display" id="bpmDisplay">--</div>
        
        <div class="confidence">
            Confidence
            <div class="confidence-bar">
                <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
            </div>
        </div>

        <div class="note-resolution">
            <label>
                <input type="radio" name="resolution" value="6" onchange="updateNoteResolution(this.value)"> 
                Smart
            </label>
            <label>
                <input type="radio" name="resolution" value="1" onchange="updateNoteResolution(this.value)"> 
                1/2 Note
            </label>
            <label>
                <input type="radio" name="resolution" value="2" onchange="updateNoteResolution(this.value)" checked> 
                1/4 Note
            </label>
            <label>
                <input type="radio" name="resolution" value="3" onchange="updateNoteResolution(this.value)"> 
                1/8 Note
            </label>
            <label>
                <input type="radio" name="resolution" value="4" onchange="updateNoteResolution(this.value)"> 
                1/8 Note Triplet
            </label>
            <label>
                <input type="radio" name="resolution" value="5" onchange="updateNoteResolution(this.value)"> 
                1/16 Note
            </label>
        </div>
        <div class="note-resolution">
            <label>
                <input type="checkbox" name="heuristicsCheckbox" checked onchange="toggleHeuristics(this.checked)"> 
                Tempo Smoothing
            </label>
        </div>
        
        <button id="startBtn" onclick="startAudio()" disabled>Start</button>
        <div class="status" id="status">Loading WASM...</div>
    </div>

<script type="module">        
        let audioContext = null;
        let clearDisplayTimeout = null;
        let audioWorkletNode = null;

        
        let currentDisplayBpm = 0.0;
        const ALPHA = 0.15; // EMA smoothing factor (lower = smoother)
        const CONF_THRESHOLD = 0.45; // Ignore incoming BPMs if confidence is below this
        let VISUAL_DEADZONE = 0.2; // BPM changes smaller than this won't update the display to prevent jitter. Default value, will be overridden by worklet message

        window.startAudio = async function() {
            const btn = document.getElementById('startBtn');
            const status = document.getElementById('status');
            
            try {
                btn.disabled = true;
                status.textContent = 'Requesting microphone access...';

                // Create AudioContext
                audioContext = new AudioContext({ sampleRate: 48000 });
                
                // Request microphone stream
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    }
                });

                // Fetch WASM binary on main thread
                status.textContent = 'Downloading WASM binary...';
                const wasmResponse = await fetch('livebpm_wasm.wasm');
                const wasmBinary = await wasmResponse.arrayBuffer();

                status.textContent = 'Loading WASM Module...';

                // Load AudioWorklet
                await audioContext.audioWorklet.addModule('processor.js');

                // Create worklet node
                audioWorkletNode = new AudioWorkletNode(audioContext, 'livebpm-processor');
                
                // Listen for results from worklet
                audioWorkletNode.port.onmessage = (event) => {
                    const { type, data, message } = event.data;
                    if (type === 'ready') {
                        status.textContent = 'Listening... play a rhythm!';
                        btn.textContent = 'Listening...';
                        VISUAL_DEADZONE = event.data.deadzone;
                    } else if (type === 'result') {
                        updateDisplay(data);
                    } else if (type === 'error') {
                        status.textContent = 'Error: ' + message;
                    }
                };

                // Connect graph: Mic -> WorkletNode
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(audioWorkletNode);

                // Initialise WASM engine in worklet
                audioWorkletNode.port.postMessage({ 
                    type: 'init',
                    sampleRate: audioContext.sampleRate,
                    wasmBinary: wasmBinary
                });

            } catch (err) {
                status.textContent = 'Error: ' + err.message;
                btn.disabled = false;
                btn.textContent = 'Retry';
            }
        };

        window.updateNoteResolution = function(value) {
            if (audioWorkletNode) {
                audioWorkletNode.port.postMessage({
                    type: 'setResolution',
                    value: parseInt(value)
                });
                // Flush the UI state
                flushUIState();
            }
        };

        window.toggleHeuristics = function(setting) {
            if (audioWorkletNode) {
                audioWorkletNode.port.postMessage({
                    type: 'setHeuristics',
                    enabled: setting
                });
                // Flush the UI state
                flushUIState();
            }
        };

        function flushUIState() {
            currentDisplayBpm = 0.0;
            document.getElementById('bpmDisplay').textContent = '--';
            document.getElementById('confidenceFill').style.width = '0%';
        }

        function updateDisplay(data) {
            const bpmEl = document.getElementById('bpmDisplay');
            const confEl = document.getElementById('confidenceFill');
            
            if (data.hasValidEstimate) {
                if (clearDisplayTimeout) {
                    clearTimeout(clearDisplayTimeout);
                    clearDisplayTimeout = null;
                }

                // Confidence Gating. Only process the new BPM if the engine is confident
                if (data.confidence >= CONF_THRESHOLD) {
                    
                    if (currentDisplayBpm === 0.0) {
                        currentDisplayBpm = data.bpm;
                    }

                    // Exponential Moving Average (EMA)
                    currentDisplayBpm = (ALPHA * data.bpm) + ((1.0 - ALPHA) * currentDisplayBpm);
                }

                // Floating-Point Deadzones
                let targetDisplayValue = currentDisplayBpm;

                
                // Magnetic Snapping
                let nearestWhole = Math.round(targetDisplayValue);
                if (Math.abs(targetDisplayValue - nearestWhole) < 0.15) {
                    targetDisplayValue = nearestWhole;
                }
                

                let currentlyDisplayed = parseFloat(bpmEl.textContent);

                // Apply deadzone
                if (!isNaN(currentlyDisplayed)) {
                    if (Math.abs(targetDisplayValue - currentlyDisplayed) < VISUAL_DEADZONE) {
                        targetDisplayValue = currentlyDisplayed; 
                    }
                }

                // Update DOM
                bpmEl.textContent = targetDisplayValue.toFixed(1);
                confEl.style.width = (data.confidence * 100) + '%';

            } else {
                // INVALID READING
                // Start a 2-second countdown to clear the display if there are no valid estimates
                if (!clearDisplayTimeout) {
                    clearDisplayTimeout = setTimeout(() => {
                        currentDisplayBpm = 0.0; // Reset the EMA tracker
                        bpmEl.textContent = '--';
                        confEl.style.width = '0%';
                    }, 2000);
                }
            }
        }

        // Enable the button once the script is loaded
        document.getElementById('status').textContent = 'Ready. Press Start.';
        document.getElementById('startBtn').disabled = false;
    </script>
</body>
</html>
